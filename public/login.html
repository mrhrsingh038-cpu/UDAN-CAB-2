<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>UDAN CAB - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111,#2b2b2b);
    padding:20px;
}

.container{
    width:420px;
    max-width:100%;
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo span{
    color:#f5c400;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    margin-bottom:25px;
    border-bottom:1px solid #ddd;
}

.tab{
    width:50%;
    padding:13px;
    border:none;
    background:none;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    color:#d6a900;
    border-bottom:3px solid #f5c400;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#f5c400;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:7px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.submit-btn:hover{
    background:#222;
}

.message{
    display:none;
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    text-align:center;
    font-size:14px;
}

.message.error{
    display:block;
    background:#ffe5e5;
    color:#c00000;
}

.message.success{
    display:block;
    background:#e4ffe9;
    color:#08752c;
}

.driver-fields{
    display:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;
}

.back:hover{
    color:#000;
}

</style>

</head>

<body>


<div class="container">

<div class="logo">
UDAN<span>CAB</span>
</div>

<div class="subtitle">
Ride anywhere. Anytime.
</div>


<div class="tabs">

<button
class="tab active"
id="loginTab"
onclick="showLogin()">

Login

</button>


<button
class="tab"
id="registerTab"
onclick="showRegister()">

Register

</button>

</div>


<div
id="message"
class="message">
</div>


<!-- LOGIN FORM -->

<form
id="loginForm"
onsubmit="login(event)">


<div class="form-group">

<label>
Phone Number
</label>

<input
type="tel"
id="loginPhone"
placeholder="Enter phone number"
required>

</div>


<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="Enter password"
required>

</div>


<button
type="submit"
class="submit-btn">

Login

</button>

</form>


<!-- REGISTER FORM -->

<form
id="registerForm"
style="display:none;"
onsubmit="register(event)">


<div class="form-group">

<label>
Full Name
</label>

<input
type="text"
id="registerName"
placeholder="Enter your name"
required>

</div>


<div class="form-group">

<label>
Phone Number
</label>

<input
type="tel"
id="registerPhone"
placeholder="Enter phone number"
required>

</div>


<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="registerEmail"
placeholder="Enter email">

</div>


<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="registerPassword"
placeholder="Create password"
required>

</div>


<div class="form-group">

<label>
Account Type
</label>

<select
id="registerRole"
onchange="toggleDriverFields()">

<option value="passenger">
Passenger
</option>

<option value="driver">
Driver
</option>

</select>

</div>


<div
class="driver-fields"
id="driverFields">


<div class="form-group">

<label>
Vehicle Type
</label>

<select
id="vehicleType">

<option value="Car">
Car
</option>

<option value="Auto">
Auto
</option>

<option value="Bike">
Bike
</option>

</select>

</div>


<div class="form-group">

<label>
Vehicle Number
</label>

<input
type="text"
id="vehicleNumber"
placeholder="Example: BR01AB1234">

</div>

</div>


<button
type="submit"
class="submit-btn">

Create Account

</button>

</form>


<a
href="index.html"
class="back">

← Back to UDAN CAB

</a>

</div>


<script>

const API =
    "http://localhost:5000";


function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );

    box.innerText = text;

    box.className =
        "message " + type;

}


function clearMessage(){

    const box =
        document.getElementById(
            "message"
        );

    box.innerText = "";

    box.className =
        "message";

}


function showLogin(){

    document
    .getElementById("loginForm")
    .style.display =
        "block";


    document
    .getElementById("registerForm")
    .style.display =
        "none";


    document
    .getElementById("loginTab")
    .classList
    .add("active");


    document
    .getElementById("registerTab")
    .classList
    .remove("active");


    clearMessage();

}


function showRegister(){

    document
    .getElementById("loginForm")
    .style.display =
        "none";


    document
    .getElementById("registerForm")
    .style.display =
        "block";


    document
    .getElementById("registerTab")
    .classList
    .add("active");


    document
    .getElementById("loginTab")
    .classList
    .remove("active");


    clearMessage();

}


function toggleDriverFields(){

    const role =
        document
        .getElementById(
            "registerRole"
        )
        .value;


    const fields =
        document
        .getElementById(
            "driverFields"
        );


    if(role === "driver"){

        fields.style.display =
            "block";

    }else{

        fields.style.display =
            "none";

    }

}


async function login(event){

    event.preventDefault();

    clearMessage();


    const phone =
        document
        .getElementById(
            "loginPhone"
        )
        .value
        .trim();


    const password =
        document
        .getElementById(
            "loginPassword"
        )
        .value;


    try{

        const response =
            await fetch(
                API + "/api/auth/login",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                    JSON.stringify({

                        phone,

                        password

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message
                || "Login failed"
            );

        }


        localStorage.setItem(
            "udanToken",
            data.token
        );


        localStorage.setItem(
            "udanUser",
            JSON.stringify(
                data.user
            )
        );


        showMessage(
            "Login successful. Redirecting...",
            "success"
        );


        setTimeout(
            function(){

                redirectUser(
                    data.user
                );

            },
            700
        );


    }catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


async function register(event){

    event.preventDefault();

    clearMessage();


    const name =
        document
        .getElementById(
            "registerName"
        )
        .value
        .trim();


    const phone =
        document
        .getElementById(
            "registerPhone"
        )
        .value
        .trim();


    const email =
        document
        .getElementById(
            "registerEmail"
        )
        .value
        .trim();


    const password =
        document
        .getElementById(
            "registerPassword"
        )
        .value;


    const role =
        document
        .getElementById(
            "registerRole"
        )
        .value;


    const vehicleType =
        document
        .getElementById(
            "vehicleType"
        )
        .value;


    const vehicleNumber =
        document
        .getElementById(
            "vehicleNumber"
        )
        .value
        .trim();


    if(
        role === "driver"
        &&
        !vehicleNumber
    ){

        showMessage(
            "Vehicle number is required for driver registration.",
            "error"
        );

        return;

    }


    try{

        const response =
            await fetch(
                API + "/api/auth/register",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                    JSON.stringify({

                        name,

                        phone,

                        email,

                        password,

                        role,

                        vehicleType:
                            role === "driver"
                            ? vehicleType
                            : "",

                        vehicleNumber:
                            role === "driver"
                            ? vehicleNumber
                            : ""

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message
                || "Registration failed"
            );

        }


        localStorage.setItem(
            "udanToken",
            data.token
        );


        localStorage.setItem(
            "udanUser",
            JSON.stringify(
                data.user
            )
        );


        if(role === "driver"){

            showMessage(
                "Driver account created. Admin approval is required before accepting rides.",
                "success"
            );

        }else{

            showMessage(
                "Account created successfully.",
                "success"
            );

        }


        setTimeout(
            function(){

                redirectUser(
                    data.user
                );

            },
            1000
        );


    }catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


function redirectUser(user){

    if(!user){

        location.href =
            "index.html";

        return;

    }


    if(user.role === "admin"){

        location.href =
            "admin.html";

        return;

    }


    if(user.role === "driver"){

        location.href =
            "driver.html";

        return;

    }


    location.href =
        "index.html";

}


window.addEventListener(
    "load",
    function(){

        const token =
            localStorage.getItem(
                "udanToken"
            );


        const user =
            JSON.parse(
                localStorage.getItem(
                    "udanUser"
                )
                || "null"
            );


        if(token && user){

            /*
              Existing login is kept.
              User can still use the forms.
            */

        }

    }
);

</script>

</body>

</html>
