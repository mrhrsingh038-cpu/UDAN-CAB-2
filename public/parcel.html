<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UDAN CAB - Parcel Delivery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header span {
            color: #fbbf24;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #15803d;
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .parcel-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .parcel-card h3 {
            margin-bottom: 10px;
        }

        .parcel-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .accepted {
            background: #dbeafe;
            color: #1e40af;
        }

        .picked {
            background: #e0e7ff;
            color: #3730a3;
        }

        .delivered {
            background: #dcfce7;
            color: #166534;
        }

        .cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .login-box {
            text-align: center;
            padding: 30px;
        }

        .login-box button {
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
        }

        @media (max-width: 650px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 19px;
            }

            .container {
                width: 94%;
            }

            .card {
                padding: 18px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .parcel-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>
        UDAN <span>CAB</span> - Parcel Delivery
    </h1>

    <button class="back-btn" onclick="goHome()">
        Back to Home
    </button>

</header>


<div class="container">

    <!-- ================= CREATE PARCEL ================= -->

    <div class="card">

        <h2>📦 Send a Parcel</h2>

        <form id="parcelForm">

            <div class="row">

                <div class="form-group">

                    <label>
                        Sender Name
                    </label>

                    <input
                        type="text"
                        id="senderName"
                        placeholder="Enter sender name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Sender Phone
                    </label>

                    <input
                        type="tel"
                        id="senderPhone"
                        placeholder="Enter sender phone"
                        required
                    >

                </div>

            </div>


            <div class="row">

                <div class="form-group">

                    <label>
                        Receiver Name
                    </label>

                    <input
                        type="text"
                        id="receiverName"
                        placeholder="Enter receiver name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Receiver Phone
                    </label>

                    <input
                        type="tel"
                        id="receiverPhone"
                        placeholder="Enter receiver phone"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Pickup Address
                </label>

                <textarea
                    id="pickup"
                    placeholder="Enter parcel pickup address"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Delivery Address
                </label>

                <textarea
                    id="destination"
                    placeholder="Enter parcel delivery address"
                    required
                ></textarea>

            </div>


            <div class="row">

                <div class="form-group">

                    <label>
                        Parcel Type
                    </label>

                    <select id="parcelType">

                        <option value="Document">
                            Document
                        </option>

                        <option value="Small Package">
                            Small Package
                        </option>

                        <option value="Medium Package">
                            Medium Package
                        </option>

                        <option value="Large Package">
                            Large Package
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Approx. Weight
                    </label>

                    <input
                        type="number"
                        id="weight"
                        placeholder="Weight in kg"
                        min="0"
                        step="0.1"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Parcel Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe your parcel"
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Create Parcel Request
            </button>

        </form>


        <div
            id="result"
            class="result"
        ></div>

    </div>


    <!-- ================= MY PARCELS ================= -->

    <div class="card">

        <h2>📋 My Parcel Requests</h2>

        <div id="parcelList">

            <div class="loading">
                Loading parcel requests...
            </div>

        </div>

    </div>

</div>


<script>

    /* =========================================
       CONFIG
    ========================================= */

    const API = "http://localhost:5000";

    const TOKEN =
        localStorage.getItem("udanToken");

    let USER = null;

    try {

        USER =
            JSON.parse(
                localStorage.getItem("udanUser")
            );

    } catch (error) {

        USER = null;

    }


    /* =========================================
       LOGIN CHECK
    ========================================= */

    if (!TOKEN || !USER) {

        document.body.innerHTML = `

            <div class="container">

                <div class="card login-box">

                    <h2>
                        Login Required
                    </h2>

                    <p>
                        Please login to use parcel delivery.
                    </p>

                    <button onclick="goLogin()">
                        Go to Login
                    </button>

                </div>

            </div>

        `;

    }


    /* =========================================
       AUTH HEADERS
    ========================================= */

    function headers() {

        return {

            "Content-Type": "application/json",

            "Authorization":
                `Bearer ${TOKEN}`

        };

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================
       SHOW RESULT
    ========================================= */

    function showResult(message, type) {

        const result =
            document.getElementById("result");

        result.innerText = message;

        result.className =
            "result " + type;

        result.style.display = "block";

    }


    /* =========================================
       FORM SUBMIT
    ========================================= */

    document
        .getElementById("parcelForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            if (!TOKEN) {

                goLogin();

                return;

            }


            const submitBtn =
                document.getElementById("submitBtn");


            submitBtn.disabled = true;

            submitBtn.innerText =
                "Creating Parcel Request...";


            const parcelData = {

                senderName:
                    document.getElementById(
                        "senderName"
                    ).value.trim(),

                senderPhone:
                    document.getElementById(
                        "senderPhone"
                    ).value.trim(),

                receiverName:
                    document.getElementById(
                        "receiverName"
                    ).value.trim(),

                receiverPhone:
                    document.getElementById(
                        "receiverPhone"
                    ).value.trim(),

                pickup:
                    document.getElementById(
                        "pickup"
                    ).value.trim(),

                destination:
                    document.getElementById(
                        "destination"
                    ).value.trim(),

                parcelType:
                    document.getElementById(
                        "parcelType"
                    ).value,

                weight:
                    Number(
                        document.getElementById(
                            "weight"
                        ).value
                    ),

                description:
                    document.getElementById(
                        "description"
                    ).value.trim(),

                type: "parcel"

            };


            try {

                /*
                 * Parcel API depends on the backend.
                 *
                 * If your server has a dedicated parcel
                 * endpoint, this will use it.
                 */

                const response =
                    await fetch(
                        API + "/api/parcels",
                        {
                            method: "POST",
                            headers: headers(),
                            body: JSON.stringify(
                                parcelData
                            )
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error ||
                        "Unable to create parcel request."
                    );

                }


                showResult(
                    "Parcel request created successfully!",
                    "success"
                );


                document
                    .getElementById("parcelForm")
                    .reset();


                loadParcels();


            } catch (error) {

                console.error(error);

                showResult(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );

            } finally {

                submitBtn.disabled = false;

                submitBtn.innerText =
                    "Create Parcel Request";

            }

        });


    /* =========================================
       LOAD MY PARCELS
    ========================================= */

    async function loadParcels() {

        const container =
            document.getElementById(
                "parcelList"
            );


        if (!TOKEN) {

            container.innerHTML =
                '<div class="empty">Please login first.</div>';

            return;

        }


        container.innerHTML =
            '<div class="loading">Loading parcel requests...</div>';


        try {

            const response =
                await fetch(
                    API + "/api/parcels/my",
                    {
                        method: "GET",
                        headers: headers()
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Unable to load parcels."
                );

            }


            const parcels =
                data.parcels ||
                data ||
                [];


            if (
                !Array.isArray(parcels) ||
                parcels.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        No parcel requests found.

                    </div>

                `;

                return;

            }


            let html = "";


            parcels.forEach(parcel => {

                const status =
                    String(
                        parcel.status ||
                        "pending"
                    ).toLowerCase();


                html += `

                    <div class="parcel-card">

                        <h3>
                            📦
                            ${escapeHTML(
                                parcel.parcelType ||
                                "Parcel"
                            )}
                        </h3>


                        <div class="parcel-info">

                            <div>
                                <strong>
                                    Sender:
                                </strong>

                                ${escapeHTML(
                                    parcel.senderName ||
                                    "-"
                                )}
                            </div>


                            <div>
                                <strong>
                                    Receiver:
                                </strong>

                                ${escapeHTML(
                                    parcel.receiverName ||
                                    "-"
                                )}
                            </div>


                            <div>
                                <strong>
                                    Pickup:
                                </strong>

                                ${escapeHTML(
                                    parcel.pickup ||
                                    "-"
                                )}
                            </div>


                            <div>
                                <strong>
                                    Delivery:
                                </strong>

                                ${escapeHTML(
                                    parcel.destination ||
                                    "-"
                                )}
                            </div>


                            <div>
                                <strong>
                                    Weight:
                                </strong>

                                ${escapeHTML(
                                    parcel.weight ||
                                    0
                                )}
                                kg
                            </div>


                            <div>
                                <strong>
                                    Driver:
                                </strong>

                                ${
                                    parcel.driver &&
                                    parcel.driver.name
                                    ?
                                    escapeHTML(
                                        parcel.driver.name
                                    )
                                    :
                                    "Not Assigned"
                                }

                            </div>

                        </div>


                        <div>

                            <span
                                class="status ${status}"
                            >
                                ${escapeHTML(
                                    status.toUpperCase()
                                )}
                            </span>

                        </div>

                    </div>

                `;

            });


            container.innerHTML = html;


        } catch (error) {

            console.error(error);

            container.innerHTML = `

                <div class="empty">

                    Unable to load parcel requests.

                    <br><br>

                    <small>
                        ${escapeHTML(
                            error.message
                        )}
                    </small>

                </div>

            `;

        }

    }


    /* =========================================
       NAVIGATION
    ========================================= */

    function goHome() {

        window.location.href =
            "index.html";

    }


    function goLogin() {

        window.location.href =
            "login.html";

    }


    /* =========================================
       INITIAL LOAD
    ========================================= */

    if (TOKEN) {

        loadParcels();

    }


    /* =========================================
       AUTO REFRESH
    ========================================= */

    setInterval(() => {

        if (TOKEN) {

            loadParcels();

        }

    }, 15000);

</script>

</body>
</html>
